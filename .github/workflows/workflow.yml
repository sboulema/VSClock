name: VSClock

on:
  push:
    branches:
      - main
      - 'feature/**'

env:
  version: '1.3.${{ github.run_number }}'
  dotnetVersion: '8'
  repoUrl: ${{ github.server_url }}/${{ github.repository }}
  vsixPath: src/VSClock/bin/Release/net472/VSClock.vsix
  vsixManifestPath: ${{ github.workspace }}/src/VSClock/source.extension.vsixmanifest

jobs:
  build:
    name: 🛠️ Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.dotnetVersion }}.x

      - name: Restore/Build/Test
        run: dotnet test

      - name: Update Vsix Manifest Version
        id: vsix_version
        uses: timheuer/vsix-version-stamp@v2
        with:
          version-number: ${{ env.version }}
          manifest-file: ${{ env.vsixManifestPath }}

      - name: Build VSIX
        run: dotnet publish src/VSClock -p:Version=${{ env.version }} -c Release

      - name: Publish Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: VSClock
          path: |
            ${{ github.workspace }}/${{ env.vsixPath }}
            publish-manifest.json
            README.md

  release:
    if: github.ref_name == 'main'
    name: 🚚 Release
    needs: build
    runs-on: windows-latest
    environment: Release
    permissions:
        contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: VSClock

      - name: Tag release
        id: tag_release
        uses: mathieudutour/github-tag-action@v7
        with:
          custom_tag: '${{ env.version }}'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create a GitHub release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ steps.tag_release.outputs.new_tag }}
          name: ${{ steps.tag_release.outputs.new_tag }}
          body: ${{ steps.tag_release.outputs.changelog }}
          artifacts: ${{ github.workspace }}/${{ env.vsixPath }}
          skipIfReleaseExists: true

  publish:
    if: github.ref_name == 'main'
    name: 🚀 Publish
    needs: release
    runs-on: windows-latest
    permissions:
        contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8

      - name: Publish to Marketplace
        uses: madskristensen/publish-marketplace@v2
        with:
          extension-file: ${{ github.workspace }}/${{ env.vsixPath }}
          publish-manifest-file: publish-manifest.json
          personal-access-code: ${{ secrets.VS_PUBLISHER_ACCESS_TOKEN }} # Trusted publishing blocked on https://github.com/microsoft/vsmarketplace/issues/2310

      - name: Publish to Open VSIX Gallery
        uses: madskristensen/publish-vsixgallery@v1
        with:
          vsix-file: ${{ env.vsixPath }}